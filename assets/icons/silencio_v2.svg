<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="face" cx="40%" cy="35%" r="70%">
      <stop offset="0" stop-color="#fff3a0"/>
      <stop offset="0.5" stop-color="#ffd43b"/>
      <stop offset="0.85" stop-color="#f5a623"/>
      <stop offset="1" stop-color="#e08a12"/>
    </radialGradient>
    <radialGradient id="ground" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#7a4a00" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7a4a00" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="eye" cx="35%" cy="30%" r="75%">
      <stop offset="0" stop-color="#5a3a1a"/>
      <stop offset="1" stop-color="#2b1a0a"/>
    </radialGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f4f4"/>
      <stop offset="0.5" stop-color="#b9bcc2"/>
      <stop offset="1" stop-color="#7d8188"/>
    </linearGradient>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#8a5200" flood-opacity="0.35"/>
    </filter>
    <filter id="small" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <ellipse cx="256" cy="474" rx="150" ry="20" fill="url(#ground)"/>

  <circle cx="256" cy="246" r="210" fill="url(#face)" filter="url(#drop)"/>
  <circle cx="256" cy="246" r="210" fill="none" stroke="#c97a0a" stroke-opacity="0.4" stroke-width="3"/>
  <ellipse cx="215" cy="110" rx="125" ry="55" fill="url(#gloss)" transform="rotate(-12 215 110)"/>

  <!-- eyes -->
  <ellipse cx="180" cy="210" rx="24" ry="36" fill="url(#eye)"/>
  <ellipse cx="332" cy="210" rx="24" ry="36" fill="url(#eye)"/>
  <ellipse cx="172" cy="196" rx="8" ry="11" fill="#fff" opacity="0.8"/>
  <ellipse cx="324" cy="196" rx="8" ry="11" fill="#fff" opacity="0.8"/>

  <!-- zipper mouth -->
  <g filter="url(#small)">
    <rect x="150" y="316" width="212" height="22" rx="11" fill="#6b3f12"/>
    <g fill="url(#metal)">
      <rect x="164" y="312" width="10" height="30" rx="3"/>
      <rect x="186" y="312" width="10" height="30" rx="3"/>
      <rect x="208" y="312" width="10" height="30" rx="3"/>
      <rect x="230" y="312" width="10" height="30" rx="3"/>
      <rect x="252" y="312" width="10" height="30" rx="3"/>
      <rect x="274" y="312" width="10" height="30" rx="3"/>
      <rect x="296" y="312" width="10" height="30" rx="3"/>
      <rect x="318" y="312" width="10" height="30" rx="3"/>
    </g>
    <rect x="334" y="306" width="30" height="42" rx="8" fill="url(#metal)" stroke="#6e7278" stroke-width="2"/>
    <rect x="340" y="344" width="18" height="44" rx="7" fill="url(#metal)" stroke="#6e7278" stroke-width="2"/>
    <rect x="345" y="360" width="8" height="18" rx="4" fill="#6b3f12"/>
  </g>
</svg>
